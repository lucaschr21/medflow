services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}
    container_name: ${POSTGRES_CONTAINER_NAME:-medflow-postgres}
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      TZ: ${TZ:-America/Belem}
      POSTGRES_USER: ${DB_USERNAME:-medflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medflow}
      POSTGRES_DB: ${DB_NAME:-medflow}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-medflow} -d ${DB_NAME:-medflow}']
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: ${KEYCLOAK_CONTAINER_NAME:-medflow-keycloak}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Belem}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_NAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-medflow}
      KC_DB_SCHEMA: ${KEYCLOAK_DB_SCHEMA:-keycloak}
      KC_DB_USERNAME: ${DB_USERNAME:-medflow}
      KC_DB_PASSWORD: ${DB_PASSWORD:-medflow}
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
    command:
      - start-dev
      - '--import-realm'
      - '--spi-theme--static-max-age=-1'
      - '--spi-theme--cache-themes=false'
      - '--spi-theme--cache-templates=false'
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import
      - ./docker/keycloak/themes:/opt/keycloak/themes
    ports:
      - '8085:8080'

volumes:
  postgres_data:
