@if (!ready()) {
  <section class="app-shell__boot">
    <div class="app-shell__boot-panel">
      <span class="app-shell__boot-mark">Medflow</span>
      <strong class="app-shell__boot-title">Inicializando sessão...</strong>
    </div>
  </section>
} @else {
  <div class="app-shell">
    <div class="app-shell__sidebar">
      <app-sidebar [groups]="visibleNavGroups()" [collapsed]="sidebarCollapsed()" />
    </div>

    <p-drawer
      [visible]="mobileMenuVisible()"
      (visibleChange)="mobileMenuVisible.set($event)"
      position="left"
      [modal]="true"
      [dismissible]="true"
      [closable]="false"
      styleClass="app-shell__mobile-drawer"
    >
      <app-sidebar [groups]="visibleNavGroups()" [collapsed]="false" />
    </p-drawer>

    <div class="app-shell__content">
      <app-topbar
        [sidebarCollapsed]="sidebarCollapsed()"
        [currentOrganization]="currentOrganization()"
        (mobileMenuOpen)="openMobileMenu()"
        (sidebarCollapseToggle)="toggleSidebarCollapse()"
      />

      <main class="app-shell__main">
        @if (loadingPermissions()) {
          <div class="app-shell__loading">Carregando permissões...</div>
        } @else {
          <router-outlet />
        }
      </main>
    </div>
  </div>
}
