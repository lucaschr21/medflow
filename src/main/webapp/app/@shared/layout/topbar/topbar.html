<header class="topbar">
  <div class="topbar__start">
    <button
      pButton
      type="button"
      icon="pi pi-bars"
      severity="secondary"
      text
      rounded
      class="topbar__mobile-btn"
      (click)="mobileMenuOpen.emit()"
      aria-label="Abrir menu"
    ></button>

    <span class="topbar__greeting">{{ greeting() }}</span>
  </div>

  <div class="topbar__end">
    <button
      pButton
      type="button"
      severity="secondary"
      text
      rounded
      (click)="toggleUserMenu($event)"
      aria-label="Menu do usuário"
    >
      <p-avatar [label]="userInitials()" size="normal" styleClass="bg-primary text-white" />
    </button>

    <p-menu #userMenu [model]="userMenuItems()" [popup]="true" appendTo="body" />
  </div>
</header>
